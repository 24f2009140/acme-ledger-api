
services:
  - type: web
    name: acme-ledger-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 240
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LEDGER_CONTEXT_URL
        sync: false
      - key: REFRESH_TOKEN
        generateValue: true
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
